  - path: /opt/app/.git/config
    permissions: '0644'
    content: |
      [remote "origin"]
        url = git@github.com:core-prod-platform/infrastructure.git
        fetch = +refs/heads/*:refs/remotes/origin/*
      [user]
        name = svc-deploy
        email = svc-deploy@core-prod.internal
  - path: /opt/app/deploy/README.md
    permissions: '0644'
    content: |
      # Deployment runbook
      Use the svc-deploy service account to rotate credentials in Key Vault.
      CI/CD pulls infrastructure from GitHub (core-prod-platform/infrastructure) via the deploy key.
      Jump host: prod-jump (see ~/.ssh/config).
