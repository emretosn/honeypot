#cloud-config
# Base configuration for the core-prod application host.
write_files:
  - path: /home/sysadmin/.ssh/config
    permissions: '0600'
    content: |
      Host prod-jump
        HostName jump.core-prod.internal
        User svc-deploy
        IdentityFile ~/.ssh/id_prod
      Host github.com
        User git
        IdentityFile ~/.ssh/id_github
  - path: /opt/app/.env
    permissions: '0640'
    content: |
      # Application configuration (production)
      DB_CONNECTION="Server=sql-core-prod.database.windows.net;Database=core;User Id=app_rw;Password=mj5K9W3iGj22JzJNlid5;"
